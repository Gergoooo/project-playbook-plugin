name: Release
# Tag-driven release: push a tag like v1.2.0 -> GitHub release with generated notes.
# Add build/upload steps for your artifacts (binaries, packages, app bundles) before the release step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # - <build artifacts here>
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # files: dist/*
