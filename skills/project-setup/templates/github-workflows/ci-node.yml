name: CI
# Stack template (node). Replace commands with the ones in docs/TESTING.md.
# Runs on PRs into dev, main, epic/** and phase/** branches, and is callable
# from publish.yml (workflow_call) so publishing can depend on green tests.
# Pin third-party actions to a commit SHA before going public (Dependabot keeps them fresh).
on:
  pull_request:
    branches: [dev, main, "epic/**", "phase/**"]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
