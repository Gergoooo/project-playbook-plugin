name: Playbook checks
# Enforces what hooks only advise: status updated, scaffold intact, no secrets.
on:
  pull_request:
    branches: [dev, main, 'epic/**']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: ROADMAP Current status updated in module PRs
        if: github.base_ref != 'main'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -qvE '^(docs/|\.github/|\.githooks/|\.claude/|scripts/|README|CLAUDE)'; then
            echo "$changed" | grep -qE '^docs/ROADMAP.md$' || { echo "::error::Code changed but docs/ROADMAP.md (Current status / story ✅) was not updated"; exit 1; }
          fi
      - name: Scaffold intact
        run: python3 scripts/verify.py . --ci --expect "${PLAYBOOK_EXPECT:-ci}" | python3 -c "import json,sys; d=json.load(sys.stdin); bad=[i['name'] for i in d['items'] if not i['pass']]; print('score',d['score'],'failing',bad); sys.exit(1 if d['score']<0.9 else 0)"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
