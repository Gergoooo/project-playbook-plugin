name: Plugin CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 && sudo mv actionlint /usr/local/bin/
      - name: Git identity for fixture repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Tests (scripts, hook, templates, manifests)
        run: python -m unittest discover -s tests -v
