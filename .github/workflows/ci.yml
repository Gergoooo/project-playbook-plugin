name: Plugin CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck && bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 && sudo mv actionlint /usr/local/bin/
      - name: Git identity for fixture repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Tests (scripts, hook, templates, manifests)
        run: python -m unittest discover -s tests -v
